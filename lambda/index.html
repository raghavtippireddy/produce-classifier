<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Produce Classifier</title>
<style>
  :root { --bg:#faf8f3; --card:#fff; --ink:#1f2421; --muted:#6b726d; --accent:#2f7d4f; --bar:#e4ece6; --line:#e3e0d8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151816; --card:#1e2220; --ink:#ecefed; --muted:#9aa39d; --accent:#5cc287; --bar:#2a332d; --line:#2e3430; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:32px 16px 48px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  label.drop { display:block; border:2px dashed var(--line); border-radius:14px; background:var(--card);
    padding:28px 16px; text-align:center; cursor:pointer; transition:border-color .15s; }
  label.drop:hover, label.drop.over { border-color:var(--accent); }
  label.drop input { display:none; }
  #preview { display:none; width:100%; max-height:340px; object-fit:contain; border-radius:10px; margin-top:16px; }
  #result { margin-top:20px; }
  .row { margin:10px 0; }
  .row .top { display:flex; justify-content:space-between; font-weight:600; text-transform:capitalize; }
  .row .track { height:10px; background:var(--bar); border-radius:5px; overflow:hidden; margin-top:4px; }
  .row .fill { height:100%; background:var(--accent); border-radius:5px; transition:width .4s; }
  .row:not(:first-child) .top { font-weight:400; color:var(--muted); }
  .status { color:var(--muted); }
  details { margin-top:28px; color:var(--muted); font-size:.9rem; }
  summary { cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>What produce is this?</h1>
  <p class="sub">Upload a photo of a fruit or vegetable. A TensorFlow model running on AWS Lambda will guess what it is.</p>

  <label class="drop" id="drop">
    <input type="file" id="file" accept="image/*">
    <strong>Choose a photo</strong> or drop one here
  </label>
  <img id="preview" alt="Your photo">
  <div id="result"></div>

  <details>
    <summary>What it knows</summary>
    <p id="labels">Loading…</p>
    <p>It only knows these items, so anything else gets its closest guess. Best results: one item, well lit, filling most of the frame.</p>
  </details>
</main>
<script>
const $ = (id) => document.getElementById(id);

fetch("labels").then(r => r.json()).then(d => { $("labels").textContent = d.labels.join(", "); })
  .catch(() => { $("labels").textContent = "(couldn't load list)"; });

// Shrink on the phone before upload: faster, and stays under Lambda's 6 MB request limit.
async function shrink(file, max = 640) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.9));
}

async function classify(file) {
  if (!file || !file.type.startsWith("image/")) return;
  $("preview").src = URL.createObjectURL(file);
  $("preview").style.display = "block";
  $("result").innerHTML = '<p class="status">Thinking… (the first request after a while takes a few extra seconds)</p>';
  try {
    const r = await fetch("predict", { method: "POST", headers: { "content-type": "image/jpeg" }, body: await shrink(file) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    $("result").innerHTML = d.predictions.map(p => `
      <div class="row">
        <div class="top"><span>${p.label}</span><span>${Math.round(p.confidence * 100)}%</span></div>
        <div class="track"><div class="fill" style="width:${(p.confidence * 100).toFixed(1)}%"></div></div>
      </div>`).join("");
  } catch (e) {
    $("result").innerHTML = `<p class="status">Something went wrong: ${e.message}</p>`;
  }
}

$("file").addEventListener("change", e => classify(e.target.files[0]));
const drop = $("drop");
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); classify(e.dataTransfer.files[0]); });
</script>
</body>
</html>
